<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Септик</title>
<meta name="description" content="Откачка септика в Благовещенске: цена по району, заказ за минуту.">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Септик">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}/* Ассенизатор Благовещенск — оформление.
   Тёмный iOS-стиль: чёрный фон, графитовые карточки, сгруппированные списки,
   цветные плитки-иконки, «таблетки» с параметрами и крупная цифра заполнения
   бочки. Акцент — зелёный, выбор и главные кнопки — системный синий.
   Две темы: светлая и тёмная, как в iOS. */

:root {
  color-scheme: light;
  --bg: #f2f2f7;
  --card: #ffffff;
  --card-2: #e9e9ee;
  --card-3: #ffffff;
  --line: #e5e5ea;
  --line-strong: #c7c7cc;
  --text: #000000;
  --muted: #6c6c70;
  --muted-2: #aeaeb2;
  --blue: #007aff;
  --blue-ink: #0062cc;
  --green: #34c759;
  --accent: #1a9e50;
  --orange: #ff9500;
  --red: #ff3b30;
  --yellow: #ffcc00;
  --yellow-ink: #9a7300;
  --purple: #af52de;
  --teal: #30b0c7;
  --glass: rgb(242 242 247 / 86%);
  --sheet: #ffffff;
  --panel: #ffffff;
  --mark-a: #ffffff;
  --mark-b: #e9e9ee;
  --mark-line: rgb(0 0 0 / 6%);
  --shadow: 0 1px 2px rgb(0 0 0 / 5%), 0 6px 20px rgb(0 0 0 / 6%);
  /* карта */
  --land: #eef0f2;
  --foreign: #dfdfe4;
  --water: #a9cbef;
  --water-ink: #2f6fb3;
  --ink: #1c1c1e;
  --surface: #ffffff;
  --signal: #ffcc00;
  --brand: #007aff;
  --f-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  --f-round: ui-rounded, "SF Pro Rounded", "Nunito", -apple-system, system-ui, sans-serif;
  --r: 16px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}


/* Тёмная тема: по настройке телефона, по выбору зрителя или переключателем в приложении (data-ui). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-ui="light"]) {
    color-scheme: dark;
    --bg: #0a0a0c;
    --card: #1c1c1e;
    --card-2: #2c2c2e;
    --card-3: #3a3a3c;
    --line: #2c2c2e;
    --line-strong: #48484a;
    --text: #ffffff;
    --muted: #8e8e93;
    --muted-2: #636366;
    --blue: #0a84ff;
    --blue-ink: #64a8ff;
    --green: #30d158;
    --accent: #3be07f;
    --orange: #ff9f0a;
    --red: #ff453a;
    --yellow: #ffd60a;
    --yellow-ink: #ffd60a;
    --purple: #bf5af2;
    --teal: #40c8e0;
    --glass: rgb(10 10 12 / 86%);
    --sheet: #161618;
    --panel: #121214;
    --mark-a: #2a2a2e;
    --mark-b: #141416;
    --mark-line: rgb(255 255 255 / 6%);
    --shadow: none;
    --land: #141416;
    --foreign: #0b0b0c;
    --water: #133b66;
    --water-ink: #6fa8e8;
    --ink: #e5e5ea;
    --surface: #1c1c1e;
    --signal: #ffd60a;
    --brand: #0a84ff;
  }
}
:root[data-theme="dark"]:not([data-ui="light"]),
:root[data-ui="dark"] {
  color-scheme: dark;
  --bg: #0a0a0c;
  --card: #1c1c1e;
  --card-2: #2c2c2e;
  --card-3: #3a3a3c;
  --line: #2c2c2e;
  --line-strong: #48484a;
  --text: #ffffff;
  --muted: #8e8e93;
  --muted-2: #636366;
  --blue: #0a84ff;
  --blue-ink: #64a8ff;
  --green: #30d158;
  --accent: #3be07f;
  --orange: #ff9f0a;
  --red: #ff453a;
  --yellow: #ffd60a;
  --yellow-ink: #ffd60a;
  --purple: #bf5af2;
  --teal: #40c8e0;
  --glass: rgb(10 10 12 / 86%);
  --sheet: #161618;
  --panel: #121214;
  --mark-a: #2a2a2e;
  --mark-b: #141416;
  --mark-line: rgb(255 255 255 / 6%);
  --shadow: none;
  --land: #141416;
  --foreign: #0b0b0c;
  --water: #133b66;
  --water-ink: #6fa8e8;
  --ink: #e5e5ea;
  --surface: #1c1c1e;
  --signal: #ffd60a;
  --brand: #0a84ff;
}

/* ---------- база ---------- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 var(--f-text);
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
a { color: var(--blue); }
svg { flex-shrink: 0; }
.num, .gauge-num, .big-price b, .tile b, .time-tile, .from, .price-r { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.white { color: var(--text); }
.small { font-size: 0.86rem; }
.center { text-align: center; justify-content: center; }
.sel { user-select: all; }
.block-line { display: block; }
.inline-ic { vertical-align: -2px; margin-left: 4px; color: var(--muted); }
.green { color: var(--green); }
.warn-text { color: var(--orange); }
.danger-text { color: var(--red) !important; }
.boot { min-height: 100vh; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- демо-панель ---------- */
.demo-bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px var(--gutter-r) 8px var(--gutter-l);
  background: var(--glass);
  backdrop-filter: saturate(160%) blur(18px);
  -webkit-backdrop-filter: saturate(160%) blur(18px);
  border-bottom: 1px solid var(--line);
}
.demo-tag { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.role-switch { display: flex; gap: 2px; flex: 1; min-width: 0; max-width: 440px; margin-inline: auto; background: var(--card-2); border-radius: 10px; padding: 2px; }
.role-switch button {
  flex: 1 1 auto; min-width: 0; border: 0; background: transparent; padding: 7px 4px; border-radius: 8px;
  font-size: 0.84rem; font-weight: 600; white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; justify-content: center; color: var(--muted);
}
.role-switch button[aria-selected="true"] { background: var(--card-3); color: var(--text); box-shadow: var(--shadow); }
.reset { border: 0; background: transparent; color: var(--muted); font-size: 0.8rem; padding: 6px 2px; }
.reset.on { color: var(--red); font-weight: 700; }
.theme-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--card-2); color: var(--text); display: grid; place-items: center; flex-shrink: 0; padding: 0; }
.theme-btn svg { width: 17px; height: 17px; }
@media (max-width: 420px) { .demo-tag { display: none; } .demo-bar { gap: 6px; } }
.dot-count, .badge {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff;
  font-size: 0.7rem; font-weight: 800; display: inline-grid; place-items: center; line-height: 1;
}

/* ---------- экран ---------- */
.screen {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 12px var(--gutter-r) 120px var(--gutter-l);
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.block { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.top-bar { display: flex; align-items: center; gap: 12px; }
.app-mark {
  width: 48px; height: 48px; border-radius: 13px; display: grid; place-items: center; flex-shrink: 0;
  background: linear-gradient(160deg, var(--mark-a), var(--mark-b)); box-shadow: inset 0 0 0 1px var(--mark-line), var(--shadow);
}
.app-mark .tile-ic { border-radius: 13px; }
.top-title { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.top-title b { font: 700 1.3rem var(--f-display); letter-spacing: -0.02em; }
.top-title small { color: var(--muted); font-size: 0.86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.round-btn {
  position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; flex-shrink: 0;
  background: var(--card); color: var(--text); display: grid; place-items: center; text-decoration: none;
}
.round-btn.light { background: rgb(255 255 255 / 22%); color: #fff; }
.round-btn .badge { position: absolute; top: -3px; right: -3px; }

.nav-bar { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 44px; }
.nav-title { margin: 0; font: 600 1.05rem var(--f-display); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-right { min-width: 44px; display: flex; justify-content: flex-end; }
.step-of { color: var(--muted); font-size: 0.86rem; white-space: nowrap; }

/* живой заказ */
.live-card {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
  padding: 14px 16px; border-radius: var(--r); border: 0; background: var(--card);
}
.live-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--muted-2); animation: pulse 1.8s infinite; }
.live-dot.sm { width: 8px; height: 8px; display: inline-block; animation: none; vertical-align: 1px; }
.live-dot.on { background: var(--green); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgb(255 255 255 / 25%); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

/* главный блок */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 8px 0 4px; }
.hero-tank { margin-bottom: -6px; }
.display { margin: 0; font: 800 2.1rem/1.08 var(--f-display); letter-spacing: -0.035em; text-wrap: balance; }
.accent { color: var(--accent); }
.hero-sub { margin: 0; color: var(--muted); max-width: 32ch; }
.hero .display { font-size: 2.6rem; }
.vol-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; text-align: left;
  padding: 14px 12px; border-radius: 16px; border: 0; background: var(--card); color: var(--text); box-shadow: var(--shadow);
  transition: transform 0.1s ease;
}
.vol-card:active { transform: scale(0.97); }
.vol-card b { font: 800 1.35rem/1 var(--f-round); letter-spacing: -0.02em; white-space: nowrap; margin-top: 4px; }
.vol-card span:last-child { color: var(--accent); font-weight: 600; font-size: 0.86rem; white-space: nowrap; }
@media (max-width: 360px) { .vol-card b { font-size: 1.15rem; } }

/* таблетки */
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: calc(-1 * var(--gutter-l)) calc(-1 * var(--gutter-r)); padding-inline: var(--gutter-l) var(--gutter-r); }
.pills.scroll::-webkit-scrollbar { display: none; }
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px;
  background: var(--card); color: var(--muted); font-size: 0.8rem; font-weight: 500; white-space: nowrap; border: 0;
}
.pill svg { width: 13px; height: 13px; }
.pill.zone { color: var(--text); background: color-mix(in srgb, var(--z) 22%, var(--card)); }
.pill.zone::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--z); }
.btn-pill { padding: 9px 14px; font-size: 0.9rem; font-weight: 600; color: var(--text); }
.btn-pill[aria-pressed="true"] { background: var(--blue); color: #fff; }
.btn-pill svg { width: 15px; height: 15px; }

/* сгруппированные списки */
.group { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.group-title { margin: 0 0 0 16px; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.block > .group-title { margin-bottom: -2px; }
.group-box { border-radius: var(--r); background: var(--card); overflow: hidden; box-shadow: var(--shadow); }
.group-foot { margin: 0 16px; font-size: 0.82rem; color: var(--muted); }
.grow {
  position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; text-align: left;
  padding: 10px 16px; border: 0; background: transparent; color: var(--text);
}
.grow + .grow::before { content: ""; position: absolute; top: 0; right: 0; left: 64px; height: 1px; background: var(--line); }
.grow:has(> .grow-text:first-child)::before { left: 16px; }
button.grow:active { background: var(--card-2); }
@media (hover: hover) { button.grow:hover { background: var(--card-2); } }
.grow-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.grow-title { font-size: 1rem; font-weight: 500; overflow-wrap: anywhere; }
.grow-sub { font-size: 0.84rem; color: var(--muted); overflow-wrap: anywhere; }
.grow-right { display: flex; align-items: center; color: var(--text); white-space: nowrap; }
.chev { color: var(--muted-2); font-size: 1.5rem; line-height: 1; margin-left: 2px; }
.from { color: var(--accent); font-weight: 600; }
.price-r { font-weight: 600; }
.price-r small { color: var(--muted); font-weight: 400; }
.stack-r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.time-tile { width: 52px; font: 700 0.95rem var(--f-round); flex-shrink: 0; }
.tick { color: var(--blue); font-weight: 800; font-size: 1.1rem; }
.step-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--card-2); color: var(--text); display: grid; place-items: center; }
.step-btn svg { width: 18px; height: 18px; }

/* плитки-иконки */
.tile-ic { display: grid; place-items: center; border-radius: 9px; flex-shrink: 0; }
.tile-ic > svg { max-width: 62%; max-height: 62%; }
.t-blue { background: color-mix(in srgb, var(--blue) 20%, transparent); color: var(--blue); }
.t-green { background: color-mix(in srgb, var(--green) 20%, transparent); color: var(--green); }
.t-orange { background: color-mix(in srgb, var(--orange) 20%, transparent); color: var(--orange); }
.t-red { background: color-mix(in srgb, var(--red) 20%, transparent); color: var(--red); }
.t-yellow { background: color-mix(in srgb, var(--yellow) 22%, transparent); color: var(--yellow-ink); }
.t-purple { background: color-mix(in srgb, var(--purple) 20%, transparent); color: var(--purple); }
.t-teal { background: color-mix(in srgb, var(--teal) 20%, transparent); color: var(--teal); }
.t-gray { background: var(--card-2); color: var(--muted); }
.t-white { background: rgb(255 255 255 / 22%); color: #fff; }
.step-n { font-size: 0.82rem; font-weight: 700; }

/* карточки выбора */
.sel-grid { display: grid; gap: 8px; }
.sel-grid.one { grid-template-columns: 1fr; }
.sel-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.sel-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.sel-card {
  position: relative; display: flex; align-items: center; gap: 10px; text-align: left; width: 100%; min-width: 0;
  padding: 12px; border-radius: 14px; border: 0; background: var(--card); color: var(--text); box-shadow: var(--shadow);
  transition: background 0.15s ease, transform 0.1s ease;
}
.sel-card:active { transform: scale(0.98); }
.sel-card.on { background: var(--blue); }
.sel-card.static:active { transform: none; }
.sel-card.big { padding: 16px; }
.sel-grid.three .sel-card:not(.compact) { flex-direction: column; align-items: flex-start; gap: 8px; }
.sel-card.compact { justify-content: center; text-align: center; padding: 12px 6px; min-height: 52px; }
.sel-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.sel-title { font-weight: 600; font-size: 0.98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel-card.big .sel-title, .sel-grid.one .sel-title { white-space: normal; }
.sel-card.big .sel-title { font: 700 1.15rem/1.2 var(--f-display); }
.sel-sub { font-size: 0.78rem; color: var(--muted); }
.sel-card.on .sel-sub { color: rgb(255 255 255 / 78%); }
.sel-card.compact .sel-title { font-size: 0.95rem; }
.sel-check { position: absolute; top: 10px; right: 10px; width: 20px; height: 20px; border-radius: 50%; background: #fff; color: var(--blue); display: grid; place-items: center; }
.sel-grid.one .sel-check { position: static; flex-shrink: 0; }
.warn-on { color: var(--yellow-ink); }
.sel-card.on .warn-on { color: #fff; font-weight: 600; }

/* поля */
.input, .field input, .field textarea, .code-input {
  width: 100%; min-width: 0; padding: 14px 16px; border-radius: 12px; border: 0; background: var(--card); color: var(--text); font-size: 1rem;
}
textarea.input { resize: vertical; }
.input::placeholder, .frow input::placeholder, .search input::placeholder { color: var(--muted-2); }
.input:focus, .field input:focus { outline: 2px solid var(--blue); outline-offset: 0; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 0.82rem; color: var(--muted); }
.form .frow { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 52px; position: relative; }
.form .frow + .frow::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
.frow span { width: 84px; flex-shrink: 0; }
.frow input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 1rem; padding: 14px 0; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.86rem; color: var(--muted); padding: 0 4px; }
.check input { width: 20px; height: 20px; margin: 0; accent-color: var(--blue); flex-shrink: 0; }
.code-input { font: 700 2.2rem var(--f-round); letter-spacing: 0.4em; text-align: center; padding: 18px; }
.money { display: flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 12px; background: var(--card); }
.money input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font: 700 1.6rem var(--f-round); padding: 12px 0; }
.money span { color: var(--muted); font-size: 1.1rem; }
.money.sm input { font-size: 1.1rem; padding: 13px 0; }
.money:focus-within { outline: 2px solid var(--blue); }

.note { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--card); font-size: 0.9rem; display: flex; gap: 8px; align-items: flex-start; color: var(--text); }
.note svg { width: 17px; height: 17px; margin-top: 1px; flex-shrink: 0; }
.note.warn { background: color-mix(in srgb, var(--orange) 16%, var(--card)); }
.note.danger { background: color-mix(in srgb, var(--red) 18%, var(--card)); }
.note.demo { background: transparent; border: 1px dashed var(--line-strong); color: var(--muted); }
.note.comment { background: color-mix(in srgb, var(--yellow) 14%, var(--card)); }
.note.comment svg { color: var(--yellow-ink); }

/* кнопки */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 14px; border: 0;
  padding: 14px 20px; font-weight: 600; font-size: 1.02rem; text-decoration: none; white-space: nowrap; min-height: 52px;
}
.btn.block { width: 100%; }
.btn.primary { background: var(--blue); color: #fff; }
.btn.primary:active { filter: brightness(0.9); }
.btn.primary:disabled { background: var(--card-2); color: var(--muted-2); }
.btn.secondary { background: var(--card); color: var(--text); }
.btn.secondary[aria-pressed="true"] { color: var(--green); }
.btn.danger { background: var(--red); color: #fff; }
.btn.link { background: none; color: var(--blue); padding: 8px 0; min-height: 0; }
.btn.huge { min-height: 64px; font-size: 1.2rem; font-weight: 700; border-radius: 18px; }
.btn svg { width: 19px; height: 19px; }
.text-btn { border: 0; background: none; color: var(--text); padding: 6px 0; font-size: 1rem; }
.two-btn { display: flex; gap: 10px; flex-wrap: wrap; }
.two-btn > * { flex: 1 1 140px; }
.confirm-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.confirm-row span { flex: 1; font-weight: 600; }

.bottom-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  display: flex; align-items: center; gap: 14px;
  padding: 12px var(--gutter-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  background: var(--glass); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: 1px solid var(--line);
}
.bottom-bar .btn { flex: 1; max-width: 520px; margin-left: auto; }
.bb-total { display: flex; flex-direction: column; line-height: 1.1; }
.bb-total small { color: var(--muted); font-size: 0.76rem; }
.bb-total b { font: 800 1.35rem var(--f-round); white-space: nowrap; color: var(--accent); }
@media (min-width: 560px) { .bottom-bar { justify-content: center; } .bottom-bar .btn { flex: 0 1 320px; margin-left: 0; } }

/* бочка */
.tank { display: block; max-width: 100%; height: auto; }
.tank-wave { animation: wave 3.2s linear infinite; }
@keyframes wave { from { transform: translateX(0); } to { transform: translateX(30px); } }

/* шкала на экране статуса */
.gauge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.gauge-num { font: 800 4.4rem/0.95 var(--f-round); letter-spacing: -0.04em; }
.gauge-cap { color: var(--muted); font-size: 0.92rem; margin-bottom: 6px; }
.gauge-status { margin: 4px 0 0; font: 700 1.4rem var(--f-display); letter-spacing: -0.02em; }
.gauge p { margin: 0; max-width: 34ch; }
.total-hero, .day-hero { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 6px 0; }
.total-hero b { font: 800 3rem/1 var(--f-round); letter-spacing: -0.03em; color: var(--accent); }
.day-hero .gauge-num { font-size: 3rem; }
.th-label { color: var(--muted); font-size: 0.9rem; }

.chip { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
.chip.s-NEW { background: color-mix(in srgb, var(--yellow) 22%, transparent); color: var(--yellow-ink); }
.chip.s-CONFIRMED { background: color-mix(in srgb, var(--blue) 22%, transparent); color: var(--blue-ink); }
.chip.s-ON_THE_WAY, .chip.s-ARRIVED { background: var(--blue); color: #fff; }
.chip.s-DONE { background: color-mix(in srgb, var(--green) 20%, transparent); color: var(--green); }
.chip.s-CANCELLED { background: var(--card-2); color: var(--muted); }
.ex { margin-left: 6px; font-size: 0.7rem; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 4px; padding: 1px 4px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 24px 8px; }
.empty p { margin: 0; max-width: 32ch; color: var(--muted); }

/* ---------- карта ---------- */
.map { position: relative; overflow: hidden; background: var(--land); border-radius: var(--r); }
.map svg { display: block; width: 100%; height: 100%; user-select: none; }
.map-zoom { position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.map-zoom button { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--card-2); color: var(--text); display: grid; place-items: center; }
.map-mini { height: 190px; }
.map-admin { height: min(62vh, 560px); }
.mk { stroke: var(--bg); }
.mk-new { fill: var(--yellow); }
.mk-active { fill: var(--blue); }
.mk-done { fill: var(--muted-2); }
.mk-muted { fill: var(--card-3); }
.mk-t { fill: var(--bg); }

.screen-map { padding: 0; max-width: none; gap: 0; position: relative; height: calc(100vh - 53px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); height: calc(100dvh - 53px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
.map-full { position: absolute; inset: 0; border-radius: 0; }
.map-top { position: absolute; z-index: 5; top: 12px; left: var(--gutter-l); right: var(--gutter-r); display: flex; gap: 8px; flex-wrap: wrap; max-width: 520px; margin: 0 auto; }
.search {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 44px; border-radius: 22px;
  background: var(--card); color: var(--muted);
}
.search svg { width: 18px; height: 18px; }
.search.inline { flex: 1 1 220px; border-radius: 12px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; color: var(--text); }
.suggest { width: 100%; border-radius: var(--r); background: var(--card); overflow: hidden; }
.sheet {
  position: absolute; z-index: 5; left: 0; right: 0; bottom: 0;
  display: flex; flex-direction: column; gap: 14px;
  padding: 10px var(--gutter-r) calc(16px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  background: var(--sheet); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgb(0 0 0 / 55%);
}
.sheet > * { width: 100%; max-width: 520px; margin-inline: auto; }
.sheet p { margin: 0; }
.sheet > .grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--line-strong); margin-bottom: 2px; }
.sheet-title { margin: 0; font: 700 1.3rem var(--f-display); }
.big-price { display: flex; flex-direction: column; gap: 2px; }
.big-price b { font: 800 2.6rem/1 var(--f-round); letter-spacing: -0.03em; color: var(--accent); }
.big-price b small { font-size: 0.5em; color: var(--muted); font-weight: 600; }
.big-price span { color: var(--muted); font-size: 0.9rem; }

/* ---------- модальная шторка ---------- */
.modal { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.modal-scrim { position: absolute; inset: 0; border: 0; background: rgb(0 0 0 / 60%); }
.modal-sheet {
  position: relative; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
  display: flex; flex-direction: column; gap: 14px;
  padding: 14px var(--gutter-r) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  background: var(--sheet); border-radius: 22px 22px 0 0; animation: rise 0.22s ease-out;
}
@keyframes rise { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 40px; }
.sheet-nav b { font-weight: 600; }
.sheet-nav .text-btn { justify-self: start; }

/* ---------- водитель ---------- */
.driver-pick { font: 700 1.3rem var(--f-display); letter-spacing: -0.02em; padding: 0 22px 0 0; border: 0; background: transparent; color: var(--text); width: auto; max-width: 100%; }
.driver-pick option { background: var(--card); }
.switch { width: 51px; height: 31px; border-radius: 16px; border: 0; background: var(--card-3); position: relative; flex-shrink: 0; padding: 0; }
.switch .knob { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: left 0.18s; box-shadow: 0 2px 4px rgb(0 0 0 / 30%); }
.switch.on { background: var(--green); }
.switch.on .knob { left: 22px; }
.drv-address { font: 700 1.5rem/1.15 var(--f-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.driver-action { position: sticky; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; }

/* ---------- диспетчер ---------- */
.admin { display: grid; grid-template-columns: 1fr; min-height: calc(100vh - 53px); }
.admin-nav { display: flex; gap: 4px; overflow-x: auto; padding: 10px var(--gutter-r) 10px var(--gutter-l); border-bottom: 1px solid var(--line); }
.admin-nav button {
  border: 0; background: transparent; padding: 9px 12px; border-radius: 10px; font-weight: 600; white-space: nowrap;
  display: inline-flex; gap: 6px; align-items: center; color: var(--muted);
}
.admin-nav button[aria-pressed="true"] { background: var(--card); color: var(--text); }
.admin-main { min-width: 0; padding: 16px var(--gutter-r) 48px var(--gutter-l); }
@media (min-width: 960px) {
  .admin { grid-template-columns: 220px minmax(0, 1fr); }
  .admin-nav { flex-direction: column; border-bottom: 0; border-right: 1px solid var(--line); padding: 16px 12px; overflow: visible; }
  .admin-nav button { justify-content: space-between; }
  .admin-main { padding: 20px 24px 48px; }
}
.h2 { font: 700 1.2rem var(--f-display); letter-spacing: -0.02em; margin: 8px 0 0; }
.h2.tight { margin: 0; }
.label { font-size: 0.78rem; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0; }
.orders-split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.orders-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.orders-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--card-2); flex: 1 1 360px; }
.seg button { flex: 1; min-width: 0; border: 0; border-radius: 8px; padding: 8px 6px; background: transparent; font-weight: 600; font-size: 0.86rem; white-space: nowrap; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card-3); color: var(--text); box-shadow: var(--shadow); }
.seg .cnt { opacity: 0.7; font-weight: 500; }
.table-wrap { overflow-x: auto; border-radius: var(--r); background: var(--card); }
.orders-table, .price-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.orders-table th, .price-table th {
  text-align: left; font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
  padding: 12px; border-bottom: 1px solid var(--line); white-space: nowrap; font-weight: 500;
}
.orders-table td, .price-table td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.orders-table tr:last-child td, .price-table tr:last-child td { border-bottom: 0; }
.orders-table tbody tr { cursor: pointer; }
.orders-table.plain tbody tr { cursor: default; }
.orders-table tbody tr:hover { background: var(--card-2); }
.orders-table tr.is-new td:first-child { box-shadow: inset 3px 0 0 var(--yellow); }
.orders-table tr[aria-selected="true"] { background: color-mix(in srgb, var(--blue) 18%, var(--card)); }
.orders-table td:nth-child(4) { min-width: 200px; }
th.num, td.num { text-align: right; white-space: nowrap; }
.zone-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; border: 2px solid transparent; }
.zone-dot.big { width: 16px; height: 16px; margin: 0; flex-shrink: 0; }
.order-panel { display: flex; flex-direction: column; gap: 16px; padding: 14px; border-radius: 20px; background: var(--panel); border: 1px solid var(--line); min-width: 0; }
@media (max-width: 959px) { .orders-split.has-sel .orders-col { display: none; } .order-panel { padding: 0; border: 0; background: transparent; } }
@media (min-width: 960px) {
  .orders-split.has-sel { grid-template-columns: minmax(0, 1fr) 400px; }
  .order-panel { position: sticky; top: calc(66px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 86px); overflow-y: auto; }
}
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two-col .group-title { margin-left: 4px; }

.zones { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1100px) { .zones { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; } .zones-map { position: sticky; top: 72px; } }
.zones-map, .zones-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.zones-map p, .zones-side p { margin: 0; }
.zone-list { list-style: none; margin: 0; padding: 0; border-radius: var(--r); background: var(--card); overflow: hidden; }
.zone-list li { display: flex; gap: 12px; align-items: center; padding: 12px 16px; position: relative; }
.zone-list li + li::before { content: ""; position: absolute; top: 0; left: 44px; right: 0; height: 1px; background: var(--line); }
.zl-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.price-table th:not(:first-child) { min-width: 108px; }
.cell-input {
  width: 100%; min-width: 80px; padding: 8px 10px; border-radius: 8px; border: 0; background: var(--card-2); color: var(--text);
  font-variant-numeric: tabular-nums; text-align: right; font-weight: 600;
}
.cell-input:focus { outline: 2px solid var(--blue); }
.rows { list-style: none; margin: 0; padding: 0; border-radius: var(--r); background: var(--card); }
.row-static { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.row-static:first-child { border-top: 0; }
.row-static small { color: var(--muted); }

.team, .stats { display: flex; flex-direction: column; gap: 14px; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.card { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: var(--r); background: var(--card); }
.card header { display: flex; justify-content: space-between; align-items: center; font: 700 1.05rem var(--f-display); }
.plate { display: inline-block; font: 600 0.8rem/1 ui-monospace, "SFMono-Regular", Menlo, monospace; padding: 3px 6px; border-radius: 5px; border: 1.5px solid var(--muted); letter-spacing: 0.04em; white-space: nowrap; }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.tile { display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: var(--r); background: var(--card); }
.tile span { font-size: 0.84rem; color: var(--muted); }
.tile b { font: 800 1.7rem var(--f-round); letter-spacing: -0.02em; }
.bars { list-style: none; margin: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; border-radius: var(--r); background: var(--card); max-width: 640px; }
.bars li { display: grid; grid-template-columns: 150px minmax(0, 1fr) 32px; gap: 12px; align-items: center; }
.bar { height: 12px; border-radius: 6px; background: var(--card-2); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 6px; }
@media (max-width: 480px) { .bars li { grid-template-columns: 110px minmax(0, 1fr) 28px; } }
</style>
